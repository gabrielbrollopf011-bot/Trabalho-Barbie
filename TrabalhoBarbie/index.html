<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="css/geral.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/index.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body onload="acessar()">
    <h1>Login</h1>
    <form action="" onsubmit="salvarLogin(event)">
        <label for="idUsuario">Usuário</label>
        <input type="text" id="idUsuario" class="inputObrigatorio">
        <label for="idSenha">Senha</label>
        <input type="password" id="idSenha" class="inputObrigatorio" required>
        <button type="submit" onSubmit="salvarLogin()" id="botao" disabled>Acessar</button>
    </form>
</body>

</html>
